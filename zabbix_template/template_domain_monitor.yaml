        - uuid: fe5ab7b905ad48baac533b4832d3f334
          name: 'Dias Restantes Expiração'
          type: DEPENDENT
          key: 'domain.expira.dias[{$DOMINIO.NOME}]'
          delay: '0'
          history: 90d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var dataExp = String(value).trim();
                  
                  if (dataExp === "" || dataExp === "null" || dataExp === "Vazio" || dataExp === "Não Suportado") {
                      return "Data de expiração não suportada";
                  }
                  
                  var ano;
                  var mes;
                  var dia;
                  
                  if (/^[0-9]{8}$/.test(dataExp)) {
                      ano = parseInt(dataExp.substring(0, 4), 10);
                      mes = parseInt(dataExp.substring(4, 6), 10);
                      dia = parseInt(dataExp.substring(6, 8), 10);
                  } else if (/^[0-9]{4}-[0-9]{2}-[0-9]{2}/.test(dataExp)) {
                      ano = parseInt(dataExp.substring(0, 4), 10);
                      mes = parseInt(dataExp.substring(5, 7), 10);
                      dia = parseInt(dataExp.substring(8, 10), 10);
                  } else {
                      return "Data de expiração inválida";
                  }
                  
                  var expMs = Date.UTC(ano, mes - 1, dia);
                  var now = new Date();
                  var nowMs = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
                  
                  var diff = expMs - nowMs;
                  var prefix = "Expira em ";
                  
                  if (diff < 0) {
                      prefix = "EXPIRADO HÁ ";
                      diff = Math.abs(diff);
                  }
                  
                  var days = Math.floor(diff / 86400000);
                  
                  if (days === 1) {
                      return prefix + "1 dia";
                  }
                  
                  return prefix + days + " dias";
          master_item:
            key: 'domain.expira[{$DOMINIO.NOME}]'
          tags:
            - tag: application
              value: 'Dados Domínio'
            - tag: component
              value: 'Dias Restantes'
        - uuid: 37a6f507a8f2492fa0c33c406bfd8d0e
          name: 'Data Expiração Domínio Formatado'
          type: DEPENDENT
          key: 'domain.expira.f[{$DOMINIO.NOME}]'
          delay: '0'
          history: 90d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = String(value).trim();
                  
                  if (d === "" || d === "null" || d === "Vazio" || d === "Não Suportado") {
                      return d;
                  }
                  
                  var ano;
                  var mesNum;
                  var dia;
                  
                  if (/^[0-9]{8}$/.test(d)) {
                      ano = d.substring(0,4);
                      mesNum = parseInt(d.substring(4,6), 10);
                      dia = d.substring(6,8);
                  } else if (/^[0-9]{4}-[0-9]{2}-[0-9]{2}/.test(d)) {
                      ano = d.substring(0,4);
                      mesNum = parseInt(d.substring(5,7), 10);
                      dia = d.substring(8,10);
                  } else {
                      return d;
                  }
                  
                  var meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
                  var mesNome = meses[mesNum - 1];
                  
                  if (!mesNome) {
                      return d;
                  }
                  
                  return dia + " " + mesNome + " " + ano;
          master_item:
            key: 'domain.expira[{$DOMINIO.NOME}]'
          tags:
            - tag: application
              value: 'Dados Domínio'
            - tag: component
              value: 'Data Expiracao'
