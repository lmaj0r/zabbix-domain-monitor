        - uuid: 9bffc20adebe4b0a967dee535f605d45
          name: 'Dias Restantes Expiração Calculado'
          type: DEPENDENT
          key: 'domain.expira.dias.calculado[{HOST.CONN}]'
          delay: '0'
          history: 90d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var dataString = value;

                  var ano = dataString.substring(0, 4);
                  var mes = dataString.substring(4, 6);
                  var dia = dataString.substring(6, 8);

                  var dataFutura = new Date(ano, mes - 1, dia);
                  var dataAtual = new Date();

                  var diffMilissegundos = dataFutura.getTime() - dataAtual.getTime();
                  var diasFaltantes = Math.ceil(diffMilissegundos / (1000 * 60 * 60 * 24));

                  return diasFaltantes;
          master_item:
            key: 'domain.expira[{$DOMINIO.NOME}]'
          tags:
            - tag: application
              value: 'Dados Dominio'
            - tag: component
              value: Dominio
          triggers:
            - uuid: b52fe3db9ae146efa588a70672ecc3e1
              expression: 'last(/Monitor de Dominios/domain.expira.dias.calculado[{HOST.CONN}])<={$ALERTA.DISATRE.EXPIRACAO}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Monitor de Dominios/domain.expira.dias.calculado[{HOST.CONN}])>={$ALERTA.DISATRE.EXPIRACAO}'
              name: 'Dominio {$DOMINIO.NOME} está perto de vencer. {ITEM.LASTVALUE1} dias Restantes'
              priority: DISASTER

            - uuid: 22d763f38fed4e4f95dbd4658312814a
              expression: 'last(/Monitor de Dominios/domain.expira.dias.calculado[{HOST.CONN}])<={$ALERTA.EXPIRACAO}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Monitor de Dominios/domain.expira.dias.calculado[{HOST.CONN}])>={$ALERTA.EXPIRACAO}'
              name: 'Dominio {$DOMINIO.NOME} está perto de vencer. {ITEM.LASTVALUE1} dias Restantes'
              priority: HIGH

            - uuid: 2ff50096d5b0418b975d00370e5689b2
              expression: 'last(/Monitor de Dominios/domain.expira.dias.calculado[{HOST.CONN}])<={$ALERTA.INFORMATIVO.EXPIRACAO}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Monitor de Dominios/domain.expira.dias.calculado[{HOST.CONN}])>={$ALERTA.INFORMATIVO.EXPIRACAO}'
              name: 'Dominio {$DOMINIO.NOME} está perto de vencer. {ITEM.LASTVALUE1} dias Restantes'
              priority: INFO

        - uuid: fe5ab7b905ad48baac533b4832d3f334
          name: 'Dias Restantes Expiração'
          type: DEPENDENT
          key: 'domain.expira.dias[{HOST.CONN}]'
          delay: '0'
          history: 90d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var dataExp = value;
                  var ano = dataExp.substring(0, 4);
                  var mes = dataExp.substring(4, 6);
                  var dia = dataExp.substring(6, 8);

                  var exp_ms = Date.UTC(ano, mes - 1, dia);

                  var now_ms = (new Date()).getTime();
                  var diff = exp_ms - now_ms;

                  var prefix = "Expira em ";
                  var formatted = "";

                  if (diff <= 0) {
                      prefix = "EXPIRADO HÁ ";
                      diff = Math.abs(diff);
                  }

                  var days = Math.floor(diff / (1000 * 60 * 60 * 24));
                  var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                  var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

                  if (days > 1) {
                      formatted = days + " dias, " + hours + "h, " + minutes + "m";
                  } else if (days === 1) {
                      formatted = days + " dia, " + hours + "h, " + minutes + "m";
                  } else {
                      formatted = hours + "h, " + minutes + "m";
                  }

                  return prefix + formatted;
          master_item:
            key: 'domain.expira[{$DOMINIO.NOME}]'
          tags:
            - tag: application
              value: 'Dados Domínio'
            - tag: component
              value: Domínio

