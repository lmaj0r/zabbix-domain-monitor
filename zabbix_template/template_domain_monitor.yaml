zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: 18e24065bf164f479da0a4735136f083
      template: 'Monitor de Dominios'
      name: 'Monitor de Dominios'
      description: |
        Template para monitorar domínios retornando diversas informações na pesquisa de whois.
        
        
        Tamplate criado pelo maj0r
        Acesse o projeto: https://github.com/lmaj0r/zabbix-domain-monitor
      groups:
        - name: Templates/Applications
      items:
        - uuid: f5ff5c212a3346549c76e9bf2eed96c1
          name: 'Data Alteração Domínio Formatado'
          type: DEPENDENT
          key: 'domain.alterado.d[{$DOMINIO.NOME}]'
          delay: '0'
          history: 90d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = String(value).trim();
                  
                  if (d === "" || d === "null" || d === "Vazio" || d === "Não Suportado") {
                      return d;
                  }
                  
                  var ano;
                  var mesNum;
                  var dia;
                  
                  if (/^[0-9]{8}$/.test(d)) {
                      ano = d.substring(0,4);
                      mesNum = parseInt(d.substring(4,6), 10);
                      dia = d.substring(6,8);
                  } else if (/^[0-9]{4}-[0-9]{2}-[0-9]{2}/.test(d)) {
                      ano = d.substring(0,4);
                      mesNum = parseInt(d.substring(5,7), 10);
                      dia = d.substring(8,10);
                  } else {
                      return d;
                  }
                  
                  var meses = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
                  var mesNome = meses[mesNum - 1];
                  
                  if (!mesNome) {
                      return d;
                  }
                  
                  return dia + " " + mesNome + " " + ano;
          master_item:
            key: 'domain.alterado[{$DOMINIO.NOME}]'
          tags:
            - tag: application
              value: 'Dados Domínio'
            - tag: component
              value: 'Data Alteracao'
