        - uuid: 9bffc20adebe4b0a967dee535f605d45
          name: 'Dias Restantes Expiração Calculado'
          type: DEPENDENT
          key: 'domain.expira.dias.calculado[{$DOMINIO.NOME}]'
          delay: '0'
          history: 90d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var dataString = String(value).trim();
                  
                  if (dataString === "" || dataString === "null" || dataString === "Vazio" || dataString === "Não Suportado") {
                      return -9999;
                  }
                  
                  var ano;
                  var mes;
                  var dia;
                  
                  if (/^[0-9]{8}$/.test(dataString)) {
                      ano = parseInt(dataString.substring(0, 4), 10);
                      mes = parseInt(dataString.substring(4, 6), 10);
                      dia = parseInt(dataString.substring(6, 8), 10);
                  } else if (/^[0-9]{4}-[0-9]{2}-[0-9]{2}/.test(dataString)) {
                      ano = parseInt(dataString.substring(0, 4), 10);
                      mes = parseInt(dataString.substring(5, 7), 10);
                      dia = parseInt(dataString.substring(8, 10), 10);
                  } else {
                      return -9999;
                  }
                  
                  var dataFutura = Date.UTC(ano, mes - 1, dia);
                  var agora = new Date();
                  var hoje = Date.UTC(agora.getUTCFullYear(), agora.getUTCMonth(), agora.getUTCDate());
                  
                  return Math.floor((dataFutura - hoje) / 86400000);
          master_item:
            key: 'domain.expira[{$DOMINIO.NOME}]'
          tags:
            - tag: application
              value: 'Dados Domínio'
            - tag: component
              value: 'Dias Restantes Calculado'
          triggers:
            - uuid: b52fe3db9ae146efa588a70672ecc3e1
              expression: 'last(/Monitor de Dominios/domain.expira.dias.calculado[{$DOMINIO.NOME}])<={$ALERTA.DISATRE.EXPIRACAO} and last(/Monitor de Dominios/domain.expira.dias.calculado[{$DOMINIO.NOME}])>=0'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Monitor de Dominios/domain.expira.dias.calculado[{$DOMINIO.NOME}])>{$ALERTA.DISATRE.EXPIRACAO} or last(/Monitor de Dominios/domain.expira.dias.calculado[{$DOMINIO.NOME}])=-9999'
              name: 'Dominio {$DOMINIO.NOME} está perto de vencer. {ITEM.LASTVALUE1} dias restantes'
              priority: DISASTER
              tags:
                - tag: alerta
                  value: Desastre
                - tag: component
                  value: Vencimento
                - tag: tipo
                  value: trigger
            - uuid: 22d763f38fed4e4f95dbd4658312814a
              expression: 'last(/Monitor de Dominios/domain.expira.dias.calculado[{$DOMINIO.NOME}])<={$ALERTA.EXPIRACAO} and last(/Monitor de Dominios/domain.expira.dias.calculado[{$DOMINIO.NOME}])>{$ALERTA.DISATRE.EXPIRACAO}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Monitor de Dominios/domain.expira.dias.calculado[{$DOMINIO.NOME}])>{$ALERTA.EXPIRACAO} or last(/Monitor de Dominios/domain.expira.dias.calculado[{$DOMINIO.NOME}])<={$ALERTA.DISATRE.EXPIRACAO} or last(/Monitor de Dominios/domain.expira.dias.calculado[{$DOMINIO.NOME}])=-9999'
              name: 'Dominio {$DOMINIO.NOME} está perto de vencer. {ITEM.LASTVALUE1} dias restantes'
              priority: HIGH
              tags:
                - tag: alerta
                  value: Critico
                - tag: component
                  value: Vencimento
                - tag: tipo
                  value: trigger
            - uuid: 2ff50096d5b0418b975d00370e5689b2
              expression: 'last(/Monitor de Dominios/domain.expira.dias.calculado[{$DOMINIO.NOME}])<={$ALERTA.INFORMATIVO.EXPIRACAO} and last(/Monitor de Dominios/domain.expira.dias.calculado[{$DOMINIO.NOME}])>{$ALERTA.EXPIRACAO}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Monitor de Dominios/domain.expira.dias.calculado[{$DOMINIO.NOME}])>{$ALERTA.INFORMATIVO.EXPIRACAO} or last(/Monitor de Dominios/domain.expira.dias.calculado[{$DOMINIO.NOME}])<={$ALERTA.EXPIRACAO} or last(/Monitor de Dominios/domain.expira.dias.calculado[{$DOMINIO.NOME}])=-9999'
              name: 'Dominio {$DOMINIO.NOME} está perto de vencer. {ITEM.LASTVALUE1} dias restantes'
