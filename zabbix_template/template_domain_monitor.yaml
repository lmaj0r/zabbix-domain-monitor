          delay: '0'
          history: 90d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d=value;
                  var meses=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

                  var ano = d.substring(0,4);
                  var mesNum = parseInt(d.substring(4,6), 10);
                  var dia = d.substring(6,8);

                  var mesNome = meses[mesNum - 1];

                  return dia + " " + mesNome + " " + ano;
          master_item:
            key: 'domain.alterado[{$DOMINIO.NOME}]'
          tags:
            - tag: application
              value: 'Dados Domínio'
            - tag: component
              value: Domínio

