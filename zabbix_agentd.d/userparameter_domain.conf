#
# Master item
# Returns all domain WHOIS data in JSON format.
#
# Example:
# zabbix_agent2 -t 'domain.dados[bernoulli.com.br]'
#
# Expected output:
# {
#   "nome": "...",
#   "status": "...",
#   "dono": "...",
#   "donocnpj": "...",
#   "dononome": "...",
#   "pais": "...",
#   "donoregistro": "...",
#   "suporteregistro": "...",
#   "dns1": "...",
#   "dns2": "...",
#   "dns3": "...",
#   "dns4": "...",
#   "criado": "...",
#   "criadonumero": "...",
#   "alterado": "...",
#   "expira": "..."
# }

UserParameter=domain.dados[*],/usr/bin/env bash /etc/zabbix/scripts/zabbix_domain_monitor.sh dados "$1"
